<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>DonUp 공유 카드 원본 (배포 제외)</title>
  <link rel="stylesheet" href="/fonts.css" />
  <!--
    링크 미리보기(og:image)용 1200x630 카드의 원본. 배포하지 않는다.
    이 페이지를 1200x630 뷰포트로 열어 그대로 캡처한다(deviceScaleFactor 1 또는 2).
    중요한 요소는 가장자리에서 64px 이상 떨어뜨려, 서비스마다 조금씩 잘려도 안전하게 둔다.
  -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      font-family: var(--font);
      color: #0b0b0d;
      word-break: keep-all;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: linear-gradient(135deg, #f7ebf6 0%, #fde4e6 42%, #ffead9 100%);
    }

    /* 평면 언덕 두 장: 소개 페이지 히어로와 같은 색 */
    .dune {
      position: absolute;
      border-radius: 50%;
    }

    .dune-a {
      left: -160px;
      bottom: -300px;
      width: 820px;
      height: 460px;
      background: #f9ddcf;
    }

    .dune-b {
      right: -220px;
      bottom: -340px;
      width: 900px;
      height: 520px;
      background: #f6d3c5;
    }

    .copy {
      position: absolute;
      left: 80px;
      top: 92px;
      width: 560px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 13px;
    }

    h1 {
      margin-top: 40px;
      font-size: 62px;
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -0.035em;
    }

    .sub {
      margin-top: 22px;
      font-size: 26px;
      font-weight: 500;
      color: rgba(11, 11, 13, 0.62);
      letter-spacing: -0.02em;
    }

    /* 오른쪽 앱 화면 두 장(실제 iPhone 16 Pro Max 캡처) */
    .phone {
      position: absolute;
      width: 214px;
      aspect-ratio: 1320 / 2868;
      overflow: hidden;
      background: transparent;
    }

    .phone img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .phone-back {
      right: 104px;
      top: 74px;
      transform: rotate(7deg);
    }

    .phone-front {
      right: 292px;
      top: 92px;
      transform: rotate(-5deg);
    }

    .obj {
      position: absolute;
      object-fit: contain;
    }

    .obj-food {
      left: 420px;
      bottom: 34px;
      width: 150px;
      transform: rotate(-8deg);
    }

    .obj-coffee {
      right: 52px;
      bottom: 30px;
      width: 130px;
      transform: rotate(8deg);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="dune dune-a"></span>
    <span class="dune dune-b"></span>

    <section class="copy">
      <div class="brand">
        <img src="./assets/screens/donup-icon-256.webp" alt="" />
        <span>DonUp</span>
      </div>
      <h1>말하면 기록되고,<br />쓴 돈이 바로 보이는<br />가계부</h1>
      <p class="sub">한 줄 입력부터 예산·통계까지</p>
    </section>

    <figure class="phone phone-back">
      <img src="./assets/screens/iphone16promax/statistics-skyblue-light.webp" alt="" />
    </figure>
    <figure class="phone phone-front">
      <img src="./assets/screens/iphone16promax/home-pink-light.webp" alt="" />
    </figure>

    <img class="obj obj-food" src="./assets/illustrations/food.webp" alt="" />
    <img class="obj obj-coffee" src="./assets/illustrations/coffee.webp" alt="" />
  </main>
</body>
</html>
